# Render Blueprint
# https://render.com/docs/blueprint-spec

services:
  # ==================== Order Service ====================
  - type: web
    name: order-service
    env: docker
    dockerfilePath: ./services/order-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: "Order Service"
      - key: DEBUG
        value: "false"
      - key: API_PREFIX
        value: "/api/v1"
      - key: LOG_LEVEL
        value: "INFO"
      - key: LOG_FORMAT
        value: "json"
      - key: DATABASE_URL
        fromDatabase:
          name: orders-db
          property: connectionString
      - key: KAFKA_BOOTSTRAP_SERVERS
        value: "kafka:29092"  # Will be replaced with Aiven later
      - key: KAFKA_SECURITY_PROTOCOL
        value: "PLAINTEXT"
      - key: KAFKA_TOPIC_ORDERS
        value: "orders"
      - key: KAFKA_TOPIC_PAYMENTS
        value: "payments"
      - key: KAFKA_GROUP_ID
        value: "order-service"
      - key: REDIS_URL
        fromService:
          type: redis
          name: app-redis
          property: connectionString

  # ==================== User Service ====================
  - type: web
    name: user-service
    env: docker
    dockerfilePath: ./services/user-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: "User Service"
      - key: DEBUG
        value: "false"
      - key: API_PREFIX
        value: "/api/v1"
      - key: LOG_LEVEL
        value: "INFO"
      - key: LOG_FORMAT
        value: "json"
      - key: DATABASE_URL
        fromDatabase:
          name: users-db
          property: connectionString
      - key: KAFKA_BOOTSTRAP_SERVERS
        value: "kafka:29092"
      - key: KAFKA_SECURITY_PROTOCOL
        value: "PLAINTEXT"
      - key: KAFKA_TOPIC_USERS
        value: "users"
      - key: KAFKA_TOPIC_ORDERS
        value: "orders"
      - key: KAFKA_GROUP_ID
        value: "user-service"
      - key: REDIS_URL
        fromService:
          type: redis
          name: app-redis
          property: connectionString

  # ==================== Notification Service ====================
  - type: web
    name: notification-service
    env: docker
    dockerfilePath: ./services/notification-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: "Notification Service"
      - key: DEBUG
        value: "false"
      - key: API_PREFIX
        value: "/api/v1"
      - key: LOG_LEVEL
        value: "INFO"
      - key: LOG_FORMAT
        value: "json"
      - key: KAFKA_BOOTSTRAP_SERVERS
        value: "kafka:29092"
      - key: KAFKA_SECURITY_PROTOCOL
        value: "PLAINTEXT"
      - key: KAFKA_TOPIC_ORDERS
        value: "orders"
      - key: KAFKA_TOPIC_USERS
        value: "users"
      - key: KAFKA_TOPIC_WORKFLOWS
        value: "workflows"
      - key: KAFKA_TOPIC_NOTIFICATIONS
        value: "notifications"
      - key: KAFKA_GROUP_ID
        value: "notification-service"
      - key: REDIS_URL
        fromService:
          type: redis
          name: app-redis
          property: connectionString

  # ==================== Workflow Service ====================
  - type: web
    name: workflow-service
    env: docker
    dockerfilePath: ./services/workflow-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: "Workflow Service"
      - key: DEBUG
        value: "false"
      - key: API_PREFIX
        value: "/api/v1"
      - key: LOG_LEVEL
        value: "INFO"
      - key: LOG_FORMAT
        value: "json"
      - key: DATABASE_URL
        fromDatabase:
          name: workflows-db
          property: connectionString
      - key: KAFKA_BOOTSTRAP_SERVERS
        value: "kafka:29092"
      - key: KAFKA_SECURITY_PROTOCOL
        value: "PLAINTEXT"
      - key: KAFKA_TOPIC_WORKFLOWS
        value: "workflows"
      - key: KAFKA_GROUP_ID
        value: "workflow-service"
      - key: REDIS_URL
        fromService:
          type: redis
          name: app-redis
          property: connectionString

  # ==================== Frontend ====================
  - type: web
    name: event-driven-frontend
    env: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    rootDir: ./frontend
    plan: free

databases:
  - name: orders-db
    databaseName: orders
    plan: free
  - name: users-db
    databaseName: users
    plan: free
  - name: workflows-db
    databaseName: workflows
    plan: free

addons:
  - type: redis
    name: app-redis
    plan: free
