name: CD — Deploy (Single Server)

on:
  push:
    branches:
      - develop    # → Staging
  release:
    types: [published]  # → Production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}

# ================================================================
# Build & Push Docker Images
# ================================================================
jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - order-service
          - user-service
          - notification-service
          - workflow-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/develop' }}
            type=ref,event=tag,enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          dockerfile: ./services/${{ matrix.service }}/Dockerfile

# ================================================================
# STAGING — deploy staging images to server
# ================================================================
  deploy-staging:
    name: Deploy Staging
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/event_driven_fastapi
            # Pull latest staging images
            docker compose pull
            # Restart with staging tag
            docker compose up -d --remove-orphans
            # Clean old images
            docker image prune -f

      - name: Health check
        uses: appleboy/ssh-action@master
        if: success()
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "=== Staging Health Check ==="
            for port in 8001 8002 8003 8004; do
              echo "Checking port $port..."
              for i in {1..15}; do
                if curl -sf "http://localhost:$port/health" > /dev/null; then
                  echo "  ✓ Port $port is healthy"
                  break
                fi
                sleep 2
              done
            done

# ================================================================
# PRODUCTION — deploy release images to same server
# ================================================================
  deploy-production:
    name: Deploy Production
    needs: build-and-push
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/event_driven_fastapi
            # Pull latest release images
            docker compose pull
            # Restart with release tag
            docker compose up -d --remove-orphans
            # Clean old images
            docker image prune -f

      - name: Health check
        uses: appleboy/ssh-action@master
        if: success()
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "=== Production Health Check ==="
            for port in 8001 8002 8003 8004; do
              echo "Checking port $port..."
              for i in {1..20}; do
                if curl -sf "http://localhost:$port/health" > /dev/null; then
                  echo "  ✓ Port $port is healthy"
                  break
                fi
                sleep 3
              done
            done

      - name: Notify Slack
        if: success()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": ":rocket: Production deployed: ${{ github.event.release.tag_name }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
