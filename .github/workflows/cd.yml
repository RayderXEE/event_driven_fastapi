name: CD — Deploy to Render

on:
  push:
    branches:
      - main    # → Production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - order-service
          - user-service
          - notification-service
          - workflow-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          dockerfile: ./services/${{ matrix.service }}/Dockerfile

  deploy-to-render:
    name: Deploy to Render
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Trigger Render Deploy
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
          echo "Render deploy triggered!"

      - name: Wait for Render Deploy
        run: |
          echo "Waiting for Render to finish deploying..."
          sleep 60  # Adjust based on your deploy time

      - name: Health Check
        run: |
          echo "=== Health Check ==="
          for service in order-service user-service notification-service workflow-service; do
            echo "Checking $service..."
            for i in {1..15}; do
              if curl -sf "https://${service}-onrender.com/health" > /dev/null; then
                echo "  ✓ $service is healthy"
                break
              fi
              sleep 2
            done
          done

      - name: Notify Slack
        if: success()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": ":rocket: Deployed to Render: ${{ github.sha }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
